services:
  db:
    image: pgvector/pgvector:pg16
    container_name: wajahni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wajahni}
      # Read from your local .env (never hard-code it here). Only used the first time the data volume is created.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-wajahni}
    ports:
      # localhost only: not reachable from other devices on your network
      - "127.0.0.1:5432:5432"
    volumes:
      - wajahni_pgdata:/var/lib/postgresql/data

volumes:
  wajahni_pgdata:
